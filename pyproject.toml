[project]
name = "nordcast"
version = "0.1.0"
description = "DK1 imbalance calls, frozen before each ISP and scored against the first print."
authors = [
    { name = "rikokardamow", email = "236246648+rikokardamow@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "opentimestamps==0.4.5",
    "opentimestamps-client==0.7.2",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=21",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "vcrpy>=9.2.0",
]
models = [
    "lightgbm>=4.6",
    "mapie>=1.0",
    "numpy>=2.3",
    "pandas>=3.1.0",
    "scikit-learn>=1.7",
    "statsmodels>=0.14",
]
reports = [
    "duckdb>=1.4",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "pandas>=3.1.0",
]
