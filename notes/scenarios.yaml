# L3 stress scenarios for the hold-into-imbalance strategy (notes/later/risk-trading-layers.md).
# Written before the stress was run. Every scenario runs under notes/limits.md.
storm_week:
  description: the 20-26 Oct 2026 storm week, replayed with the strategy's own calls
  from: "2026-10-20"   # Copenhagen days, inclusive
  to: "2026-10-26"
feed_outage:
  description: the archive stops; the position held through missing prints at the last call
  hold_hours: 6        # no new information for this long
worst_day:
  description: the worst Copenhagen day of the strategy's own history
not_run:
  pilot_first_week: the 2024 pilot isn't in this record (ImbalancePrice starts 4 Mar 2025)
  scarcity_spring_2025: 4 Mar - 1 Jun 2025 is before the clean window; no calls exist for it
feed_outage_under_rules:
  # added 29 Oct 2026 after the first stress run, which held a full position for
  # 6 h: the strategy's own rules don't allow that, so this is the outage as the
  # system would actually run it
  description: a stale feed caps the position at 2.5 MW; after 2 h persistence can't build a call, so no position
  cap_mw: 2.5
  hold_hours: 2
feed_outage_under_rules_from_30_oct:
  # added 29 Oct 2026 with the limits change (CHANGELOG.md): from 30 Oct a feed
  # stale by two ISPs means no position, so a capped position lasts one ISP
  description: the outage under the limits from 30 Oct 2026, 2.5 MW for one ISP, then flat
  cap_mw: 2.5
  hold_hours: 0.25
